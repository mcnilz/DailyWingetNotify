name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag_name:
        description: SemVer release tag, for example v1.0.0 or v1.0.0-rc.1
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.repository }}-native-aot
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: src/DailyWingetNotify/DailyWingetNotify.csproj
  RUNTIME_IDENTIFIER: win-x64

jobs:
  release:
    name: Publish GitHub release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate SemVer tag
        shell: pwsh
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          $tagName = if ($env:INPUT_TAG_NAME) { $env:INPUT_TAG_NAME } else { $env:GITHUB_REF_NAME }
          if (-not $tagName) {
            throw "Release tag is required."
          }

          $semVerPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if ($tagName -notmatch $semVerPattern) {
            throw "Release tag '$tagName' must follow SemVer, for example v1.2.3 or v1.2.3-rc.1."
          }

          $version = $tagName.Substring(1)
          $numericVersion = ($version -split '[-+]')[0]
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NUMERIC_VERSION=$numericVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Publish Native AOT
        run: >
          dotnet publish $env:PROJECT_PATH
          -c Release
          -r $env:RUNTIME_IDENTIFIER
          --self-contained true
          -p:Version=$env:RELEASE_VERSION
          -p:FileVersion=$env:RELEASE_NUMERIC_VERSION.0
          -p:AssemblyVersion=$env:RELEASE_NUMERIC_VERSION.0
          -p:InformationalVersion=$env:RELEASE_TAG

      - name: Package executable
        shell: pwsh
        run: |
          $publishDir = Join-Path "src/DailyWingetNotify/bin/Release/net10.0-windows/$env:RUNTIME_IDENTIFIER" "publish"
          $exePath = Join-Path $publishDir "DailyWingetNotify.exe"
          if (-not (Test-Path $exePath)) {
            throw "Published executable not found at $exePath"
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path $exePath -DestinationPath "artifacts/DailyWingetNotify-win-x64.zip" -Force

      - name: Create or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          $tagName = if ($env:INPUT_TAG_NAME) { $env:INPUT_TAG_NAME } else { $env:GITHUB_REF_NAME }
          if (-not $tagName) {
            throw "Release tag is required."
          }

          $assetPath = "artifacts/DailyWingetNotify-win-x64.zip"
          $notesPath = "artifacts/release-notes.md"
          $manualNotesPath = "docs/releases/$tagName.md"
          if (Test-Path $manualNotesPath) {
            Copy-Item $manualNotesPath $notesPath
          } else {
            $generatedNotes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
              --method POST `
              -f tag_name=$tagName `
              | ConvertFrom-Json
            $generatedNotes.body | Set-Content -Path $notesPath -Encoding utf8
          }

          if (gh release view $tagName --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release edit $tagName --repo $env:GITHUB_REPOSITORY --title $tagName --notes-file $notesPath
            gh release upload $tagName $assetPath --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $releaseArgs = @(
              "release",
              "create",
              $tagName,
              $assetPath,
              "--repo",
              $env:GITHUB_REPOSITORY,
              "--target",
              $env:GITHUB_SHA,
              "--title",
              $tagName,
              "--notes-file",
              $notesPath
            )

            if ($tagName -match '-') {
              $releaseArgs += "--prerelease"
            }

            & gh @releaseArgs
          }
